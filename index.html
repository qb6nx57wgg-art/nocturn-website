<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nocturn News — Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@400;500;600&family=Cormorant+Garant:ital,wght@1,400;1,700&display=swap" rel="stylesheet">

  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #f5f3f0;
      color: #1a1a1c;
      font-family: 'Inter', sans-serif;
    }

    /* ── Navigation ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 32px 44px;
      background: transparent;
      z-index: 100;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 20px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      line-height: 1;
    }

    .logo .slash  { color: rgba(26, 26, 28, 0.28); }
    .logo .nocturn { color: #1a1a1c; }
    .logo .news   { color: rgba(26, 26, 28, 0.28); }

    /* ── Main content ── */
    main {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 32vh;
    }

    .headline {
      text-align: center;
      line-height: 1;
      color: #1a1a1c;
    }

    .headline-display {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-style: normal;
      font-size: clamp(24px, 2.8vw, 42px);
      display: block;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .headline-bold {
      font-weight: 700;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      background: #1a1a1c;
      margin-left: 2px;
      vertical-align: middle;
      height: 0.85em;
      animation: blink 0.7s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    .coming-soon {
      margin-top: 14px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-size: 9px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(26, 26, 28, 0.28);
    }

    /* ── Globe ── */
    #globe-container {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      /* Bigger globe = wider curvature; calc keeps top edge at ~70vh regardless of screen ratio */
      width: 140vw;
      height: 140vw;
      bottom: calc(-140vw + 36vh);
      pointer-events: none;
    }

    #globe {
      width: 100%;
      height: 100%;
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      nav {
        padding: 24px 24px;
      }

      .logo {
        font-size: 15px;
      }

      main {
        padding-top: 30vh;
      }

      .headline-display {
        font-size: clamp(20px, 5.5vw, 32px);
        padding: 0 24px;
      }

      #globe-container {
        width: 200vw;
        height: 200vw;
        bottom: calc(-200vw + 30vh);
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="logo">
      <span class="slash">/</span><span class="nocturn">NOCTURN</span>&nbsp;<span class="news">NEWS</span>
    </div>
  </nav>

  <main>
    <div class="headline">
      <span class="headline-display" id="headline-text"></span>
    </div>
    <p class="coming-soon">Coming Soon</p>
  </main>

  <div id="globe-container">
    <svg id="globe"></svg>
  </div>

  <script>
    const SIZE = 1000;
    const CX = SIZE / 2;
    const CY = SIZE / 2;
    const RADIUS = SIZE / 2 - 1;

    const svg = d3.select('#globe')
      .attr('viewBox', `0 0 ${SIZE} ${SIZE}`)
      .attr('preserveAspectRatio', 'xMidYMid meet');

    // Clip path so land paths don't overflow the sphere
    const defs = svg.append('defs');
    defs.append('clipPath')
      .attr('id', 'sphere-clip')
      .append('circle')
        .attr('cx', CX)
        .attr('cy', CY)
        .attr('r', RADIUS);

    const projection = d3.geoOrthographic()
      .scale(RADIUS)
      .translate([CX, CY])
      .rotate([20, -25, 0])
      .clipAngle(90);

    const geoPath = d3.geoPath().projection(projection);

    // ── Sphere outline ──
    const circumference = 2 * Math.PI * RADIUS;
    svg.append('circle')
      .attr('cx', CX)
      .attr('cy', CY)
      .attr('r', RADIUS)
      .attr('fill', 'none')
      .attr('stroke', '#1a1a1c')
      .attr('stroke-width', 1)
      .attr('stroke-dasharray', circumference)
      .attr('stroke-dashoffset', circumference)
      .transition()
        .duration(900)
        .ease(d3.easeLinear)
        .attr('stroke-dashoffset', 0);

    // ── Land paths ──
    const landGroup = svg.append('g')
      .attr('clip-path', 'url(#sphere-clip)');

    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(r => r.json())
      .then(world => {
        const land = topojson.feature(world, world.objects.land);

        const landPath = landGroup.append('path')
          .datum(land)
          .attr('d', geoPath)
          .attr('fill', 'none')
          .attr('stroke', '#1a1a1c')
          .attr('stroke-width', 0.75)
          .attr('stroke-linejoin', 'round')
          .attr('stroke-linecap', 'round');

        const totalLength = landPath.node().getTotalLength();

        landPath
          .attr('stroke-dasharray', totalLength)
          .attr('stroke-dashoffset', totalLength)
          .transition()
            .delay(300)
            .duration(3200)
            .ease(d3.easeLinear)
            .attr('stroke-dashoffset', 0)
            .on('end', () => {
              landPath
                .attr('stroke-dasharray', null)
                .attr('stroke-dashoffset', null);
            });

        // Rotation starts immediately alongside the draw animation
        startRotation(landPath);
      });

    // ── Typing animation ──
    (function typeHeadline() {
      const container = document.getElementById('headline-text');
      const segments = [
        { text: "The World's ", bold: false },
        { text: 'Fastest',      bold: true  },
        { text: ' Financial News.', bold: false }
      ];

      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      container.appendChild(cursor);

      let si = 0, ci = 0, currentSpan = null;

      function tick() {
        if (si >= segments.length) {
          setTimeout(() => cursor.style.display = 'none', 1200);
          return;
        }
        const seg = segments[si];
        if (ci === 0) {
          currentSpan = document.createElement('span');
          if (seg.bold) currentSpan.className = 'headline-bold';
          container.insertBefore(currentSpan, cursor);
        }
        currentSpan.textContent += seg.text[ci++];
        if (ci >= seg.text.length) { si++; ci = 0; }
        setTimeout(tick, 55);
      }

      setTimeout(tick, 300);
    })();

    function startRotation(landPath) {
      let angle = 20;
      (function rotate() {
        angle += 0.12;
        projection.rotate([angle, -25, 0]);
        landPath.attr('d', geoPath);
        requestAnimationFrame(rotate);
      })();
    }
  </script>

</body>
</html>
